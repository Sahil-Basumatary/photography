name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: photography_test
          POSTGRES_USER: photography
          POSTGRES_PASSWORD: photography
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U photography -d photography_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: composer check
